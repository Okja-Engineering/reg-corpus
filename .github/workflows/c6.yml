# The corpus gate (C6, R5). CI is the gate; the pre-commit hook and the R11
# agent guard are seatbelts. Spec decision 3 left a person's bypass of the
# local hook for "CI later"; this is that CI.
#
# The checker is built from a trusted commit, never from the commit under
# test: origin/main whenever it has cmd/regcorpus/main.go, whatever the base;
# the base's commit for a pull request only while origin/main has none. So
# once origin/main has the checker, no run uses any other; a base or
# origin/main that doesn't resolve fails the run.
# Only while neither has it (bootstrap: before the checker first lands on
# main) is it built from the commit under test, with a warning annotation.
# A pull request run checks GitHub's test merge commit (the PR merged into its
# base); `edited` reruns it when the PR is retargeted to another base.
# .github/c6.sh runs the check; .githooks/build-checker.sh builds the checker,
# the same way the pre-commit hook does, with the Go the trusted commit's
# go.mod names (downloaded when the one setup-go installs, for make test from
# the commit's go.mod, is older). A push to main is checked by main's own
# checker; as a pull request it was checked by the old main's. If main's
# checker doesn't build, every run fails, the repair's too: the user merges
# the repair past this check.
#
# A PR can edit this workflow, c6.sh and build-checker.sh, which are all part
# of the gate; the user, who alone merges, reviews such diffs. Branch
# protection on main is the user's step: require the "C6 gate" check, and
# "Require branches to be up to date before merging", so the test merge
# commit that passed is what lands.
name: C6

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  c6:
    name: C6 gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base commit and origin/main
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # nothing restored from earlier runs
      - name: Check the commit with main's checker
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'refs/remotes/origin/main' }}
        # A clean environment: only HOME and PATH (which finds go) pass through.
        run: env -i HOME="$HOME" PATH="$PATH" bash .github/c6.sh "$BASE" "$GITHUB_SHA"
      - name: make test
        if: ${{ !cancelled() }}
        run: env -i HOME="$HOME" PATH="$PATH" make test
